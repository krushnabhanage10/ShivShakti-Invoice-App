services:
  db:
    image: postgres:16-alpine
    container_name: shivshakti-db
    environment:
      POSTGRES_USER: shivshakti
      POSTGRES_PASSWORD: shivshakti123
      POSTGRES_DB: receipts
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shivshakti -d receipts"]
      interval: 2s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  app:
    build: .
    container_name: shivshakti-receipts
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - DATABASE_URL=postgresql://shivshakti:shivshakti123@db:5432/receipts
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
